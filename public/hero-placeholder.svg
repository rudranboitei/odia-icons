<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1400" preserveAspectRatio="xMidYMax slice" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4dcc4"/>
      <stop offset="0.55" stop-color="#f8e9d8"/>
      <stop offset="1" stop-color="#f7f1e8"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2b98f"/>
      <stop offset="1" stop-color="#d9a97c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6e6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff6e6" stop-opacity="0"/>
    </radialGradient>
    <filter id="b4" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="b10" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="b22" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect width="2400" height="1400" fill="url(#sky)"/>
  <circle cx="1250" cy="520" r="520" fill="url(#sun)"/>

  <!-- far temples (most blurred, lightest) -->
  <g filter="url(#b10)" fill="#d9a77d" opacity="0.7">
    <path d="M1010 1000 L1010 860 C1020 780 1045 720 1070 660 C1095 720 1120 780 1130 860 L1130 1000 Z"/>
    <path d="M1180 1000 L1180 900 C1190 850 1205 815 1220 780 C1235 815 1250 850 1260 900 L1260 1000 Z"/>
    <rect x="1130" y="930" width="50" height="70"/>
  </g>

  <!-- left deula (sharper) -->
  <g filter="url(#b4)" fill="#c58e63" opacity="0.92">
    <rect x="380" y="880" width="200" height="130"/>
    <path d="M395 880 C400 720 440 560 480 400 C520 560 560 720 565 880 Z"/>
    <circle cx="480" cy="395" r="22"/>
    <rect x="477" y="340" width="6" height="45"/>
    <path d="M580 1000 L580 930 L610 930 L610 890 L650 890 L650 850 L700 850 L700 890 L740 890 L740 930 L770 930 L770 1000 Z"/>
  </g>
  <g filter="url(#b4)" fill="#b8805a" opacity="0.55">
    <path d="M395 880 C400 720 440 560 480 400 C490 470 495 520 497 880 Z"/>
  </g>

  <!-- right Konark-style temple (blurred, depth of field) -->
  <g filter="url(#b22)" fill="#c18a5f" opacity="0.95">
    <path d="M1560 1010 L1560 900 L1620 900 L1620 840 L1690 840 L1690 780 L1770 780 L1770 720 L1860 720 L1860 660 L1950 660 L1950 720 L2040 720 L2040 780 L2120 780 L2120 840 L2190 840 L2190 900 L2250 900 L2250 1010 Z"/>
    <rect x="1900" y="860" width="90" height="150" fill="#8f5f40"/>
  </g>

  <!-- wheel -->
  <g filter="url(#b22)" transform="translate(2200 880)" stroke="#b98259" stroke-width="16" fill="none" opacity="0.95">
    <circle r="140"/>
    <circle r="22" fill="#b98259"/>
    <g>
      <line x1="0" y1="-140" x2="0" y2="140"/>
      <line x1="0" y1="-140" x2="0" y2="140" transform="rotate(30)"/>
      <line x1="0" y1="-140" x2="0" y2="140" transform="rotate(60)"/>
      <line x1="0" y1="-140" x2="0" y2="140" transform="rotate(90)"/>
      <line x1="0" y1="-140" x2="0" y2="140" transform="rotate(120)"/>
      <line x1="0" y1="-140" x2="0" y2="140" transform="rotate(150)"/>
    </g>
  </g>

  <!-- distant trees -->
  <g filter="url(#b4)" fill="#b9a077" opacity="0.5">
    <circle cx="790" cy="990" r="26"/><circle cx="830" cy="982" r="32"/><circle cx="880" cy="992" r="24"/>
  </g>

  <!-- ground -->
  <rect y="1000" width="2400" height="400" fill="url(#ground)"/>
  <g fill="#cf9d72" opacity="0.9">
    <rect x="60" y="1040" width="260" height="46" rx="4"/>
    <rect x="120" y="1086" width="200" height="40" rx="4"/>
    <rect x="720" y="1090" width="220" height="42" rx="4"/>
    <rect x="1280" y="1060" width="300" height="44" rx="4"/>
    <rect x="1420" y="1104" width="260" height="40" rx="4"/>
    <rect x="1900" y="1110" width="330" height="48" rx="4"/>
  </g>
  <g fill="#bf8a5f" opacity="0.7">
    <rect x="260" y="1190" width="320" height="50" rx="4"/>
    <rect x="1000" y="1210" width="380" height="54" rx="4"/>
  </g>

  <!-- soft bottom haze for blending into the page -->
  <rect y="1150" width="2400" height="250" fill="#f7f5f1" opacity="0.35"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
